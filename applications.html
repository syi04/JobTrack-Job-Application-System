
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobTrack - Applications</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        :root {
            --navy: #102a43;
            --deep: #164e63;
            --teal: #2a9d8f;
            --cream: #f7f3e9;
            --bg: #f4f7f6;
            --text: #243b53;
            --muted: #829ab1;
            --line: #d9e2ec;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* ==================================================
           NAVBAR
        ================================================== */

        .navbar {
            background: var(--navy);
            min-height: 76px;
            padding: 0;
        }


        .nav-container {
            width: 100%;
            max-width: 1200px;

            height: 76px;

            margin: 0 auto;

            padding: 0 24px;

            display: flex;
            align-items: center;
        }


        .brand {
            display: flex;
            align-items: center;

            gap: 10px;

            color: white;

            text-decoration: none;

            font-size: 21px;
            font-weight: 700;
        }


        .brand-icon {
            width: 38px;
            height: 38px;

            border-radius: 9px;

            background: var(--teal);

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--navy);
        }


        .nav-menu {
            display: flex;
            align-items: center;

            margin-left: auto;

            gap: 6px;
        }


        .nav-menu a {
            height: 42px;

            padding: 0 17px;

            border-radius: 8px;

            display: flex;
            align-items: center;

            gap: 8px;

            color: #d9e2ec;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }


        .nav-menu a:hover {
            background:
                rgba(255,255,255,0.08);

            color: white;
        }


        .nav-menu a.active {
            background: var(--teal);

            color: var(--navy);
        }


        .logout-btn {
            color: #ffd8d8 !important;
        }


        .logout-btn:hover {
            background:
                rgba(220,53,69,0.15) !important;
        }


        /* ==================================================
           MAIN
        ================================================== */

        .main-container {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;

            padding: 36px 24px 60px;
        }


        /* ==================================================
           PAGE HEADER
        ================================================== */

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 24px;
        }


        .eyebrow {
            color: var(--teal);

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1.4px;

            margin-bottom: 6px;
        }


        .page-title {
            margin: 0;

            color: var(--navy);

            font-size: 31px;
            font-weight: 800;
        }


        .page-subtitle {
            color: var(--muted);

            font-size: 13px;

            margin:
                7px 0 0;
        }


        .new-btn {
            border: none;

            background: var(--navy);

            color: white;

            border-radius: 8px;

            padding: 11px 17px;

            font-size: 13px;
            font-weight: 800;

            display: flex;
            align-items: center;

            gap: 8px;

            transition: 0.2s;
        }


        .new-btn:hover {
            background: var(--teal);

            color: var(--navy);
        }


        /* ==================================================
           TOOLBAR
        ================================================== */

        .toolbar {
            background: white;

            border:
                1px solid var(--line);

            border-radius: 12px;

            padding: 16px;

            margin-bottom: 20px;

            display: flex;
            align-items: center;

            gap: 14px;
        }


        .search-box {
            flex: 1;

            position: relative;
        }


        .search-box i {
            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            color: var(--muted);

            z-index: 2;
        }


        .search-input {
            width: 100%;

            height: 42px;

            border:
                1px solid var(--line);

            border-radius: 8px;

            padding:
                0 14px 0 40px;

            font-size: 13px;

            outline: none;
        }


        .search-input:focus {
            border-color: var(--teal);

            box-shadow:
                0 0 0 3px
                rgba(42,157,143,0.10);
        }


        .sort-select {
            width: 170px;

            height: 42px;

            border:
                1px solid var(--line);

            border-radius: 8px;

            padding: 0 12px;

            font-size: 12px;

            color: var(--text);

            outline: none;
        }


        .sort-select:focus {
            border-color: var(--teal);
        }


        /* ==================================================
           FILTER CHIPS
        ================================================== */

        .filter-row {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 18px;

            overflow-x: auto;

            padding-bottom: 2px;
        }


        .filter-label {
            color: var(--muted);

            font-size: 11px;

            font-weight: 700;

            margin-right: 3px;

            white-space: nowrap;
        }


        .filter-chip {
            border:
                1px solid var(--line);

            background: white;

            color: var(--muted);

            border-radius: 30px;

            padding:
                7px 13px;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;

            transition: 0.2s;
        }


        .filter-chip:hover {
            border-color: var(--teal);

            color: var(--teal);
        }


        .filter-chip.active {
            background: var(--teal);

            border-color: var(--teal);

            color: var(--navy);
        }


        /* ==================================================
           APPLICATION LIST HEADER
        ================================================== */

        .list-header {
            display: grid;

            grid-template-columns:
                2fr
                1.2fr
                1fr
                1fr
                0.8fr;

            gap: 15px;

            padding:
                0 20px 10px;

            color: var(--muted);

            font-size: 9px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.8px;
        }


        /* ==================================================
           APPLICATION ITEM
        ================================================== */

        #applicationsList {
            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .application-item {
            background: white;

            border:
                1px solid var(--line);

            border-radius: 10px;

            padding:
                15px 20px;

            display: grid;

            grid-template-columns:
                2fr
                1.2fr
                1fr
                1fr
                0.8fr;

            gap: 15px;

            align-items: center;

            transition: 0.2s;
        }


        .application-item:hover {
            border-color:
                rgba(42,157,143,0.55);

            transform:
                translateX(2px);

            box-shadow:
                0 6px 20px
                rgba(16,42,67,0.05);
        }


        /* JOB */

        .job-info {
            min-width: 0;
        }


        .job-title {
            color: var(--navy);

            font-size: 13px;

            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .company-name {
            color: var(--muted);

            font-size: 10px;

            margin-top: 4px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* INFO */

        .info-value {
            color: var(--text);

            font-size: 11px;

            font-weight: 600;
        }


        .info-label {
            display: none;
        }


        /* STATUS */

        .status-badge {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: fit-content;

            padding:
                6px 10px;

            border-radius: 20px;

            font-size: 9px;

            font-weight: 800;

            white-space: nowrap;
        }


        .status-submitted {
            background: #e8f1f7;
            color: #315d7a;
        }


        .status-review {
            background: #fff3d6;
            color: #8a6100;
        }


        .status-interview {
            background: #e3f5ef;
            color: #19745e;
        }


        .status-selected {
            background: #dff5e2;
            color: #28733b;
        }


        .status-rejected {
            background: #fde7e7;
            color: #9b3434;
        }


        /* ACTIONS */

        .actions {
            display: flex;

            justify-content: flex-end;

            gap: 6px;
        }


        .action-btn {
            width: 31px;
            height: 31px;

            border:
                1px solid var(--line);

            background: white;

            border-radius: 7px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--deep);

            cursor: pointer;

            transition: 0.2s;
        }


        .action-btn:hover {
            background: var(--cream);

            border-color: var(--teal);

            color: var(--navy);
        }


        .delete-btn {
            color: #b23b3b;
        }


        .delete-btn:hover {
            background: #fff0f0;

            border-color: #e5a5a5;

            color: #9b3434;
        }


        /* ==================================================
           EMPTY STATE
        ================================================== */

        .empty-state {
            background: white;

            border:
                1px dashed var(--line);

            border-radius: 12px;

            padding: 60px 20px;

            text-align: center;
        }


        .empty-state i {
            font-size: 38px;

            color: var(--muted);
        }


        .empty-state h4 {
            color: var(--navy);

            font-size: 16px;

            font-weight: 800;

            margin:
                13px 0 6px;
        }


        .empty-state p {
            color: var(--muted);

            font-size: 12px;

            margin: 0;
        }


        /* ==================================================
           MODAL
        ================================================== */

        .modal-content {
            border: none;

            border-radius: 14px;

            overflow: hidden;
        }


        .modal-header {
            background: var(--navy);

            color: white;

            border: none;

            padding:
                18px 22px;
        }


        .modal-title {
            font-size: 17px;

            font-weight: 800;
        }


        .btn-close {
            filter:
                brightness(0)
                invert(1);
        }


        .modal-body {
            padding: 24px;
        }


        .form-label {
            color: var(--navy);

            font-size: 11px;

            font-weight: 800;

            margin-bottom: 6px;
        }


        .form-control,
        .form-select {
            border:
                1px solid var(--line);

            border-radius: 8px;

            min-height: 43px;

            font-size: 13px;
        }


        .form-control:focus,
        .form-select:focus {
            border-color: var(--teal);

            box-shadow:
                0 0 0 3px
                rgba(42,157,143,0.10);
        }


        .modal-footer {
            border-top:
                1px solid var(--line);

            padding:
                14px 22px;
        }


        .cancel-btn {
            background: #eef2f4;

            border: none;

            border-radius: 7px;

            padding:
                9px 16px;

            font-size: 12px;

            color: var(--text);
        }


        .save-btn {
            background: var(--teal);

            color: var(--navy);

            border: none;

            border-radius: 7px;

            padding:
                9px 17px;

            font-size: 12px;

            font-weight: 800;
        }


        .save-btn:hover {
            background: #238b7e;

            color: white;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        footer {
            background: var(--navy);

            color: #a9b9c8;

            text-align: center;

            padding: 22px 15px;

            font-size: 12px;
        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 900px) {

            .list-header {
                display: none;
            }


            .application-item {
                grid-template-columns:
                    1fr auto;

                gap: 12px;

                padding: 17px;
            }


            .application-item .job-info {
                grid-column: 1;
            }


            .application-item .company-column {
                grid-column: 1;
            }


            .application-item .location-column {
                grid-column: 1;
            }


            .application-item .date-column {
                grid-column: 1;
            }


            .application-item .status-column {
                grid-column: 2;

                grid-row: 1;
            }


            .application-item .actions {
                grid-column: 2;

                grid-row: 2;

                justify-content: flex-end;
            }


            .info-label {
                display: inline;

                color: var(--muted);

                font-size: 9px;

                font-weight: 700;

                margin-right: 5px;
            }

        }


        @media (max-width: 700px) {

            .nav-container {
                height: auto;

                min-height: 76px;

                padding:
                    15px 18px;

                flex-direction: column;

                gap: 12px;
            }


            .navbar {
                min-height: auto;
            }


            .brand {
                justify-content: center;
            }


            .nav-menu {
                margin-left: 0;

                justify-content: center;

                flex-wrap: wrap;
            }


            .nav-menu a {
                font-size: 12px;

                padding: 0 12px;
            }


            .main-container {
                padding:
                    28px 18px 50px;
            }


            .page-header {
                flex-direction: column;

                align-items: flex-start;
            }


            .new-btn {
                width: 100%;

                justify-content: center;
            }


            .toolbar {
                flex-direction: column;

                align-items: stretch;
            }


            .sort-select {
                width: 100%;
            }

        }


        @media (max-width: 500px) {

            .page-title {
                font-size: 27px;
            }


            .application-item {
                grid-template-columns:
                    1fr;

                position: relative;
            }


            .application-item .status-column {
                grid-column: 1;

                grid-row: auto;

                position: absolute;

                right: 17px;

                top: 17px;
            }


            .application-item .actions {
                grid-column: 1;

                grid-row: auto;

                justify-content: flex-start;
            }


            .job-title {
                padding-right: 90px;
            }

        }

    </style>

</head>


<body>


<!-- ==================================================
     NAVBAR
================================================== -->

<nav class="navbar">

    <div class="nav-container">

        <a
            href="dashboard.html"
            class="brand"
        >

            <span class="brand-icon">
                <i class="bi bi-briefcase-fill"></i>
            </span>

            JobTrack

        </a>


        <div class="nav-menu">

            <a href="dashboard.html">
                <i class="bi bi-grid-1x2-fill"></i>
                Dashboard
            </a>


            <a
                href="applications.html"
                class="active"
            >
                <i class="bi bi-file-earmark-text-fill"></i>
                Applications
            </a>


            <a href="companies.html">
                <i class="bi bi-buildings-fill"></i>
                Companies
            </a>


            <a
                href="#"
                class="logout-btn"
                onclick="logout()"
            >
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

</nav>



<!-- ==================================================
     MAIN
================================================== -->

<main class="main-container">


    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div>

            <div class="eyebrow">
                Application Management
            </div>


            <h1 class="page-title">
                My Applications
            </h1>


            <p class="page-subtitle">
                Keep track of your job applications and their current progress.
            </p>

        </div>


        <button
            class="new-btn"
            data-bs-toggle="modal"
            data-bs-target="#applicationModal"
            onclick="prepareAdd()"
        >

            <i class="bi bi-plus-lg"></i>

            New Application

        </button>

    </div>



    <!-- ================= TOOLBAR ================= -->

    <div class="toolbar">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search by job title or company..."
                oninput="renderApplications()"
            >

        </div>


        <select
            id="sortFilter"
            class="sort-select"
            onchange="renderApplications()"
        >

            <option value="newest">
                Newest First
            </option>

            <option value="oldest">
                Oldest First
            </option>

            <option value="az">
                Job Title A-Z
            </option>

            <option value="za">
                Job Title Z-A
            </option>

        </select>

    </div>



    <!-- ================= FILTER ================= -->

    <div class="filter-row">

        <span class="filter-label">
            STATUS
        </span>


        <button
            class="filter-chip active"
            data-status="All"
            onclick="setStatusFilter('All', this)"
        >
            All
        </button>


        <button
            class="filter-chip"
            data-status="Submitted"
            onclick="setStatusFilter('Submitted', this)"
        >
            Submitted
        </button>


        <button
            class="filter-chip"
            data-status="Under Review"
            onclick="setStatusFilter('Under Review', this)"
        >
            Under Review
        </button>


        <button
            class="filter-chip"
            data-status="Interview"
            onclick="setStatusFilter('Interview', this)"
        >
            Interview
        </button>


        <button
            class="filter-chip"
            data-status="Selected"
            onclick="setStatusFilter('Selected', this)"
        >
            Selected
        </button>


        <button
            class="filter-chip"
            data-status="Rejected"
            onclick="setStatusFilter('Rejected', this)"
        >
            Rejected
        </button>

    </div>



    <!-- ================= LIST HEADER ================= -->

    <div class="list-header">

        <div>
            POSITION
        </div>

        <div>
            COMPANY
        </div>

        <div>
            LOCATION
        </div>

        <div>
            APPLIED DATE
        </div>

        <div>
            ACTION
        </div>

    </div>



    <!-- ================= APPLICATIONS ================= -->

    <div id="applicationsList"></div>

</main>



<!-- ==================================================
     FOOTER
================================================== -->

<footer>

    JobTrack · Job Application Management System · IMS566

</footer>



<!-- ==================================================
     ADD / EDIT MODAL
================================================== -->

<div
    class="modal fade"
    id="applicationModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle"
                >
                    New Application
                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>



            <form id="applicationForm">

                <div class="modal-body">


                    <input
                        type="hidden"
                        id="applicationId"
                    >


                    <!-- JOB TITLE -->

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="jobTitle"
                        >
                            Job Title
                        </label>


                        <input
                            type="text"
                            id="jobTitle"
                            class="form-control"
                            placeholder="e.g. Software Developer"
                            required
                        >

                    </div>



                    <!-- COMPANY -->

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="company"
                        >
                            Company
                        </label>


                        <input
                            type="text"
                            id="company"
                            class="form-control"
                            placeholder="e.g. ABC Technologies"
                            required
                        >

                    </div>



                    <!-- LOCATION -->

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="location"
                        >
                            Location
                        </label>


                        <input
                            type="text"
                            id="location"
                            class="form-control"
                            placeholder="e.g. Kuala Lumpur"
                            required
                        >

                    </div>



                    <!-- DATE -->

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="applicationDate"
                        >
                            Application Date
                        </label>


                        <input
                            type="date"
                            id="applicationDate"
                            class="form-control"
                            required
                        >

                    </div>



                    <!-- STATUS -->

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="status"
                        >
                            Status
                        </label>


                        <select
                            id="status"
                            class="form-select"
                            required
                        >

                            <option value="Submitted">
                                Submitted
                            </option>

                            <option value="Under Review">
                                Under Review
                            </option>

                            <option value="Interview">
                                Interview
                            </option>

                            <option value="Selected">
                                Selected
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                        </select>

                    </div>

                </div>



                <div class="modal-footer">

                    <button
                        type="button"
                        class="cancel-btn"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Application
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

                "Penang",

            date:
                "2026-11-15",

            status:
                "Submitted"
        }

    ];



    /* ==================================================
       GET APPLICATIONS
    ================================================== */

    function getApplications() {

        try {

            const stored =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    )
                );


            if (
                Array.isArray(stored) &&
                stored.length > 0
            ) {

                return stored;

            }

        } catch (error) {

            console.log(
                "Invalid application data."
            );

        }


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                defaultApplications
            )
        );


        return defaultApplications;

    }



    /* ==================================================
       SAVE
    ================================================== */

    function saveApplications(
        applications
    ) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                applications
            )
        );

    }



    /* ==================================================
       ESCAPE HTML
    ================================================== */

    function escapeHTML(
        text
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }



    /* ==================================================
       FORMAT DATE
    ================================================== */

    function formatDate(
        date
    ) {

        const d =
            new Date(date);


        return d.toLocaleDateString(
            "en-GB",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }



    /* ==================================================
       STATUS CLASS
    ================================================== */

    function getStatusClass(
        status
    ) {

        if (
            status ===
            "Submitted"
        ) {
            return "status-submitted";
        }


        if (
            status ===
            "Under Review"
        ) {
            return "status-review";
        }


        if (
            status ===
            "Interview"
        ) {
            return "status-interview";
        }


        if (
            status ===
            "Selected"
        ) {
            return "status-selected";
        }


        if (
            status ===
            "Rejected"
        ) {
            return "status-rejected";
        }


        return "status-submitted";

    }



    /* ==================================================
       STATUS FILTER
    ================================================== */

    function setStatusFilter(
        status,
        button
    ) {

        currentStatus =
            status;


        document
            .querySelectorAll(
                ".filter-chip"
            )
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );

            });


        button.classList.add(
            "active"
        );


        renderApplications();

    }



    /* ==================================================
       RENDER
    ================================================== */

    function renderApplications() {

        let applications =
            getApplications();


        const search =
            document
                .getElementById(
                    "searchInput"
                )
                .value
                .toLowerCase()
                .trim();


        const sort =
            document
                .getElementById(
                    "sortFilter"
                )
                .value;



        /* SEARCH */

        applications =
            applications.filter(
                app => {

                    const title =
                        app.jobTitle
                            .toLowerCase();


                    const company =
                        app.company
                            .toLowerCase();


                    return (
                        title.includes(
                            search
                        ) ||
                        company.includes(
                            search
                        )
                    );

                }
            );



        /* STATUS */

        if (
            currentStatus !==
            "All"
        ) {

            applications =
                applications.filter(
                    app =>
                        app.status ===
                        currentStatus
                );

        }



        /* SORT */

        if (
            sort ===
            "newest"
        ) {

            applications.sort(
                (a, b) =>
                    new Date(b.date) -
                    new Date(a.date)
            );

        }

        else if (
            sort ===
            "oldest"
        ) {

            applications.sort(
                (a, b) =>
                    new Date(a.date) -
                    new Date(b.date)
            );

        }

        else if (
            sort ===
            "az"
        ) {

            applications.sort(
                (a, b) =>
                    a.jobTitle
                        .localeCompare(
                            b.jobTitle
                        )
            );

        }

        else if (
            sort ===
            "za"
        ) {

            applications.sort(
                (a, b) =>
                    b.jobTitle
                        .localeCompare(
                            a.jobTitle
                        )
            );

        }



        const container =
            document.getElementById(
                "applicationsList"
            );



        /* EMPTY */

        if (
            applications.length ===
            0
        ) {

            container.innerHTML = `

                <div class="empty-state">

                    <i class="bi bi-search"></i>

                    <h4>
                        No applications found
                    </h4>

                    <p>
                        Try changing your search or status filter.
                    </p>

                </div>

            `;

            return;

        }



        /* LIST */

        container.innerHTML =
            applications
                .map(app => `

                    <div
                        class="application-item"
                    >


                        <!-- JOB -->

                        <div
                            class="job-info"
                        >

                            <div
                                class="job-title"
                            >

                                ${escapeHTML(
                                    app.jobTitle
                                )}

                            </div>


                            <div
                                class="company-name"
                            >

                                ${escapeHTML(
                                    app.company
                                )}

                            </div>

                        </div>



                        <!-- COMPANY -->

                        <div
                            class="company-column"
                        >

                            <span class="info-label">
                                Company:
                            </span>

                            <span
                                class="info-value"
                            >

                                ${escapeHTML(
                                    app.company
                                )}

                            </span>

                        </div>



                        <!-- LOCATION -->

                        <div
                            class="location-column"
                        >

                            <span class="info-label">
                                Location:
                            </span>

                            <span
                                class="info-value"
                            >

                                <i
                                    class="bi bi-geo-alt-fill"
                                    style="color:var(--teal);margin-right:4px;"
                                ></i>

                                ${escapeHTML(
                                    app.location
                                )}

                            </span>

                        </div>



                        <!-- DATE -->

                        <div
                            class="date-column"
                        >

                            <span class="info-label">
                                Applied:
                            </span>

                            <span
                                class="info-value"
                            >

                                ${formatDate(
                                    app.date
                                )}

                            </span>

                        </div>



                        <!-- ACTION -->

                        <div
                            class="actions"
                        >

                            <span
                                class="status-badge
                                ${getStatusClass(
                                    app.status
                                )}"
                            >

                                ${escapeHTML(
                                    app.status
                                )}

                            </span>


                            <button
                                class="action-btn"
                                title="Edit"
                                onclick="editApplication(${app.id})"
                            >

                                <i class="bi bi-pencil"></i>

                            </button>


                            <button
                                class="action-btn delete-btn"
                                title="Delete"
                                onclick="deleteApplication(${app.id})"
                            >

                                <i class="bi bi-trash3"></i>

                            </button>

                        </div>

                    </div>

                `)
                .join("");

    }



    /* ==================================================
       PREPARE ADD
    ================================================== */

    function prepareAdd() {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "New Application";


        document.getElementById(
            "applicationForm"
        ).reset();


        document.getElementById(
            "applicationId"
        ).value =
            "";


        document.getElementById(
            "applicationDate"
        ).value =
            new Date()
                .toISOString()
                .split("T")[0];

    }



    /* ==================================================
       NEXT ID
    ================================================== */

    function getNextId(
        applications
    ) {

        if (
            applications.length ===
            0
        ) {

            return 1;

        }


        return (
            Math.max(
                ...applications.map(
                    app =>
                        Number(app.id) ||
                        0
                )
            ) + 1
        );

    }



    /* ==================================================
       ADD / EDIT
    ================================================== */

    document
        .getElementById(
            "applicationForm"
        )
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const applications =
                    getApplications();


                const id =
                    document
                        .getElementById(
                            "applicationId"
                        )
                        .value;


                const data = {

                    jobTitle:
                        document
                            .getElementById(
                                "jobTitle"
                            )
                            .value
                            .trim(),


                    company:
                        document
                            .getElementById(
                                "company"
                            )
                            .value
                            .trim(),


                    location:
                        document
                            .getElementById(
                                "location"
                            )
                            .value
                            .trim(),


                    date:
                        document
                            .getElementById(
                                "applicationDate"
                            )
                            .value,


                    status:
                        document
                            .getElementById(
                                "status"
                            )
                            .value

                };



                /* EDIT */

                if (
                    id
                ) {

                    const index =
                        applications.findIndex(
                            app =>
                                String(
                                    app.id
                                ) ===
                                String(
                                    id
                                )
                        );


                    if (
                        index !==
                        -1
                    ) {

                        applications[
                            index
                        ] = {

                            id:
                                applications[
                                    index
                                ].id,

                            ...data

                        };

                    }

                }



                /* ADD */

                else {

                    applications.push({

                        id:
                            getNextId(
                                applications
                            ),

                        ...data

                    });

                }



                saveApplications(
                    applications
                );


                const modal =
                    bootstrap.Modal
                        .getInstance(
                            document
                                .getElementById(
                                    "applicationModal"
                                )
                        );


                modal.hide();


                renderApplications();


                alert(
                    id
                        ? "Application updated successfully."
                        : "Application added successfully."
                );

            }
        );



    /* ==================================================
       EDIT
    ================================================== */

    function editApplication(
        id
    ) {

        const applications =
            getApplications();


        const app =
            applications.find(
                item =>
                    Number(
                        item.id
                    ) ===
                    Number(
                        id
                    )
            );


        if (
            !app
        ) {

            return;

        }


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit Application";


        document.getElementById(
            "applicationId"
        ).value =
            app.id;


        document.getElementById(
            "jobTitle"
        ).value =
            app.jobTitle;


        document.getElementById(
            "company"
        ).value =
            app.company;


        document.getElementById(
            "location"
        ).value =
            app.location;


        document.getElementById(
            "applicationDate"
        ).value =
            app.date;


        document.getElementById(
            "status"
        ).value =
            app.status;


        const modal =
            new bootstrap.Modal(
                document.getElementById(
                    "applicationModal"
                )
            );


        modal.show();

    }



    /* ==================================================
       DELETE
    ================================================== */

    function deleteApplication(
        id
    ) {

        const applications =
            getApplications();


        const app =
            applications.find(
                item =>
                    Number(
                        item.id
                    ) ===
                    Number(
                        id
                    )
            );


        if (
            !app
        ) {

            return;

        }


        const confirmDelete =
            confirm(
                `Delete "${app.jobTitle}" application?`
            );


        if (
            !confirmDelete
        ) {

            return;

        }


        const updated =
            applications.filter(
                item =>
                    Number(
                        item.id
                    ) !==
                    Number(
                        id
                    )
            );


        saveApplications(
            updated
        );


        renderApplications();


        alert(
            "Application deleted successfully."
        );

    }



    /* ==================================================
       LOGOUT
    ================================================== */

    function logout() {

        sessionStorage.removeItem(
            "jobSystemLoggedIn"
        );

        window.location.href =
            "login.html";

    }



    /* ==================================================
       INITIAL LOAD
    ================================================== */

    renderApplications();

</script>

</body>
</html>
