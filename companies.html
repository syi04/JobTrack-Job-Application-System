

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobTrack - Companies</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

    <style>
        :root {
            --navy: #102a43;
            --deep: #164e63;
            --teal: #2a9d8f;
            --cream: #f7f3e9;
            --bg: #f4f7f6;
            --text: #243b53;
            --muted: #829ab1;
            --line: #d9e2ec;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: var(--navy);
            min-height: 76px;
            padding: 0;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            height: 76px;
            margin: 0 auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .brand span {
            color: var(--teal);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            margin-left: auto;
            gap: 6px;
        }

        .nav-menu a {
            height: 42px;
            padding: 0 17px;
            border-radius: 8px;

            display: flex;
            align-items: center;

            color: #dce8ef;
            text-decoration: none;

            font-size: 0.92rem;
            font-weight: 600;

            transition: 0.2s;
        }

        .nav-menu a:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .nav-menu a.active {
            background: var(--teal);
            color: var(--navy);
        }

        .logout-btn {
            border: 1px solid rgba(255,255,255,0.25);
            margin-left: 8px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 42px 24px 60px;
        }

        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;

            margin-bottom: 28px;
        }

        .page-header h1 {
            color: var(--navy);
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .page-header p {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .company-count {
            background: var(--cream);
            color: var(--deep);

            padding: 8px 13px;
            border-radius: 999px;

            font-size: 0.75rem;
            font-weight: 700;

            white-space: nowrap;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 14px;

            padding: 18px;
            margin-bottom: 24px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);

            color: var(--muted);
        }

        .search-input {
            width: 100%;

            border: 1px solid var(--line);
            border-radius: 9px;

            padding: 11px 13px 11px 40px;

            font-size: 0.85rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 0.15rem rgba(42,157,143,0.12);
        }

        /* =========================
           INSIGHT CARDS
        ========================= */

        .insight-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;

            margin-bottom: 28px;
        }

        .insight-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 14px;

            padding: 20px;
        }

        .insight-top {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .insight-icon {
            width: 43px;
            height: 43px;

            border-radius: 10px;

            background: var(--cream);
            color: var(--teal);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .insight-label {
            color: var(--muted);
            font-size: 0.76rem;
            margin-bottom: 3px;
        }

        .insight-value {
            color: var(--navy);
            font-size: 1.45rem;
            font-weight: 700;
        }

        /* =========================
           COMPANY GRID
        ========================= */

        .company-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .company-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 14px;

            padding: 23px;

            transition: 0.2s;
        }

        .company-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(16, 42, 67, 0.08);
            border-color: #c5d8e4;
        }

        .company-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;

            margin-bottom: 20px;
        }

        .company-logo {
            width: 48px;
            height: 48px;
            min-width: 48px;

            border-radius: 12px;

            background: var(--navy);
            color: var(--teal);

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 1rem;
        }

        .company-info {
            flex: 1;
        }

        .company-info h2 {
            color: var(--navy);
            font-size: 1rem;
            font-weight: 700;

            margin: 2px 0 5px;
        }

        .company-info p {
            color: var(--muted);
            font-size: 0.78rem;
            margin: 0;
        }

        .application-count {
            background: #e8f1f7;
            color: #28627a;

            padding: 6px 9px;
            border-radius: 999px;

            font-size: 0.68rem;
            font-weight: 700;

            white-space: nowrap;
        }

        /* =========================
           DISTRIBUTION
        ========================= */

        .distribution {
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .distribution-header {
            display: flex;
            justify-content: space-between;

            font-size: 0.72rem;
            margin-bottom: 8px;
        }

        .distribution-header span:first-child {
            color: var(--muted);
        }

        .distribution-header span:last-child {
            color: var(--navy);
            font-weight: 700;
        }

        .progress {
            height: 8px;
            background: #e8eef2;
            border-radius: 999px;
        }

        .progress-bar {
            background: var(--teal);
            border-radius: 999px;
        }

        /* =========================
           STATUS BREAKDOWN
        ========================= */

        .status-breakdown {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 16px;
        }

        .mini-status {
            padding: 5px 8px;
            border-radius: 999px;

            font-size: 0.65rem;
            font-weight: 700;
        }

        .mini-submitted {
            background: #e8f1f7;
            color: #28627a;
        }

        .mini-review {
            background: #fff3cd;
            color: #8a6500;
        }

        .mini-interview {
            background: #dff4ef;
            color: #176b5e;
        }

        .mini-selected {
            background: #dcefe0;
            color: #28653a;
        }

        .mini-rejected {
            background: #f8dddd;
            color: #8a3030;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            grid-column: 1 / -1;

            background: white;
            border: 1px dashed var(--line);
            border-radius: 14px;

            padding: 55px 20px;
            text-align: center;
        }

        .empty-state i {
            font-size: 2rem;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: var(--navy);
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .empty-state p {
            color: var(--muted);
            font-size: 0.82rem;
            margin: 0;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: var(--navy);
            color: #b9cbd6;
            text-align: center;

            padding: 22px 20px;

            font-size: 0.78rem;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {
            .insight-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .company-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .nav-container {
                height: auto;
                min-height: 76px;
                padding: 14px 18px;
                flex-wrap: wrap;
            }

            .nav-menu {
                width: 100%;
                margin-top: 12px;
                margin-left: 0;
                overflow-x: auto;
            }

            .nav-menu a {
                flex-shrink: 0;
            }

            main {
                padding: 28px 18px 50px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .insight-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="nav-container">

        <a href="dashboard.html" class="brand">
            Job<span>Track</span>
        </a>


        <div class="nav-menu">

            <a href="dashboard.html">
                <i class="bi bi-grid-1x2-fill me-2"></i>
                Dashboard
            </a>


            <a href="applications.html">
                <i class="bi bi-file-earmark-text me-2"></i>
                Applications
            </a>


            <a href="companies.html" class="active">
                <i class="bi bi-buildings me-2"></i>
                Companies
            </a>


            <a
                href="#"
                class="logout-btn"
                onclick="logout()"
            >
                <i class="bi bi-box-arrow-right me-2"></i>
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main>

    <!-- PAGE HEADER -->

    <section class="page-header">

        <div>

            <h1>
                Companies
            </h1>

            <p>
                View companies where you have submitted job applications.
            </p>

        </div>

        <div
            class="company-count"
            id="companyCount"
        >
            0 Companies
        </div>

    </section>


    <!-- SEARCH -->

    <section class="search-card">

        <div class="search-wrapper">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="companySearch"
                class="search-input"
                placeholder="Search company..."
                oninput="renderCompanies()"
            >

        </div>

    </section>


    <!-- INSIGHTS -->

    <section class="insight-grid">

        <div class="insight-card">

            <div class="insight-top">

                <div class="insight-icon">
                    <i class="bi bi-buildings"></i>
                </div>

                <div>

                    <div class="insight-label">
                        Total Companies
                    </div>

                    <div
                        class="insight-value"
                        id="totalCompanies"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>


        <div class="insight-card">

            <div class="insight-top">

                <div class="insight-icon">
                    <i class="bi bi-send-check"></i>
                </div>

                <div>

                    <div class="insight-label">
                        Total Applications
                    </div>

                    <div
                        class="insight-value"
                        id="totalApplications"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>


        <div class="insight-card">

            <div class="insight-top">

                <div class="insight-icon">
                    <i class="bi bi-graph-up-arrow"></i>
                </div>

                <div>

                    <div class="insight-label">
                        Most Applied Company
                    </div>

                    <div
                        class="insight-value"
                        id="topCompany"
                        style="font-size:1rem;"
                    >
                        -
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- COMPANY CARDS -->

    <section
        id="companyGrid"
        class="company-grid"
    ></section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>
    JobTrack · Job Application Management System · IMS566
</footer>


<script>

    /* =========================================
       LOGIN PROTECTION
    ========================================= */

    if (
        sessionStorage.getItem("jobSystemLoggedIn")
        !== "true"
    ) {
        window.location.href = "login.html";
    }


    /* =========================================
       STORAGE
    ========================================= */

    const STORAGE_KEY =
        "jobTrackApplications";


    /* =========================================
       DEFAULT DATA
       Same data as Dashboard + Applications
    ========================================= */

    const defaultApplications = [

        {
            id: 1,
            jobTitle: "Frontend Developer",
            company: "TechNova Solutions",
            location: "Kuala Lumpur",
            date: "2026-11-10",
            status: "Interview"
        },

        {
            id: 2,
            jobTitle: "UI/UX Designer",
            company: "Digital Core",
            location: "Selangor",
            date: "2026-11-12",
            status: "Under Review"
        },

        {
            id: 3,
            jobTitle: "IT Support Executive",
            company: "Alpha Systems",
            location: "Penang",
            date: "2026-11-15",
            status: "Submitted"
        }

    ];


    /* =========================================
       LOAD APPLICATIONS
    ========================================= */

    function loadApplications() {

        try {

            const saved =
                localStorage.getItem(STORAGE_KEY);


            if (!saved) {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        defaultApplications
                    )
                );

                return [
                    ...defaultApplications
                ];
            }


            const data =
                JSON.parse(saved);


            if (
                !Array.isArray(data)
                || data.length === 0
            ) {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        defaultApplications
                    )
                );

                return [
                    ...defaultApplications
                ];
            }


            return data;

        } catch (error) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    defaultApplications
                )
            );

            return [
                ...defaultApplications
            ];
        }
    }


    const applications =
        loadApplications();


    /* =========================================
       GROUP APPLICATIONS BY COMPANY
    ========================================= */

    function groupByCompany() {

        const companies = {};


        applications.forEach(app => {

            const company =
                app.company.trim();


            if (!companies[company]) {

                companies[company] = {
                    name: company,
                    location: app.location,
                    applications: []
                };

            }


            companies[company]
                .applications
                .push(app);

        });


        return Object.values(companies);
    }


    /* =========================================
       STATUS CLASS
    ========================================= */

    function getStatusClass(status) {

        switch (status) {

            case "Submitted":
                return "mini-submitted";

            case "Under Review":
                return "mini-review";

            case "Interview":
                return "mini-interview";

            case "Selected":
                return "mini-selected";

            case "Rejected":
                return "mini-rejected";

            default:
                return "mini-submitted";
        }
    }


    /* =========================================
       COMPANY INITIAL
    ========================================= */

    function getCompanyInitial(company) {

        return company
            .trim()
            .charAt(0)
            .toUpperCase();
    }


    /* =========================================
       RENDER COMPANIES
    ========================================= */

    function renderCompanies() {

        const grid =
            document.getElementById(
                "companyGrid"
            );


        const search =
            document.getElementById(
                "companySearch"
            )
            .value
            .toLowerCase()
            .trim();


        let companies =
            groupByCompany();


        /* SEARCH */

        companies =
            companies.filter(company =>
                company.name
                    .toLowerCase()
                    .includes(search)
            );


        /* SORT */

        companies.sort(
            (a, b) =>
                b.applications.length
                -
                a.applications.length
        );


        /* COMPANY COUNT */

        const allCompanies =
            groupByCompany();


        document.getElementById(
            "companyCount"
        ).textContent =
            `${allCompanies.length} ${
                allCompanies.length === 1
                    ? "Company"
                    : "Companies"
            }`;


        document.getElementById(
            "totalCompanies"
        ).textContent =
            allCompanies.length;


        document.getElementById(
            "totalApplications"
        ).textContent =
            applications.length;


        /* MOST APPLIED COMPANY */

        if (allCompanies.length > 0) {

            const top =
                [...allCompanies].sort(
                    (a, b) =>
                        b.applications.length
                        -
                        a.applications.length
                )[0];


            document.getElementById(
                "topCompany"
            ).textContent =
                top.name;

        } else {

            document.getElementById(
                "topCompany"
            ).textContent =
                "-";
        }


        /* EMPTY */

        if (companies.length === 0) {

            grid.innerHTML = `

                <div class="empty-state">

                    <i class="bi bi-search"></i>

                    <h3>
                        No companies found
                    </h3>

                    <p>
                        Try searching for another company.
                    </p>

                </div>

            `;

            return;
        }


        /* FIND MAX APPLICATIONS */

        const maxApplications =
            Math.max(
                ...companies.map(
                    company =>
                        company.applications.length
                )
            );


        /* RENDER */

        grid.innerHTML =
            companies.map(company => {

                const apps =
                    company.applications;


                const percentage =
                    Math.round(
                        (
                            apps.length
                            /
                            applications.length
                        ) * 100
                    );


                const statuses = {};


                apps.forEach(app => {

                    statuses[app.status] =
                        (statuses[app.status] || 0)
                        + 1;

                });


                const statusHTML =
                    Object.entries(statuses)
                        .map(
                            ([status, count]) => {

                                return `
                                    <span
                                        class="mini-status ${getStatusClass(status)}"
                                    >
                                        ${status}: ${count}
                                    </span>
                                `;
                            }
                        )
                        .join("");


                return `

                    <article class="company-card">

                        <div class="company-top">

                            <div class="company-logo">
                                ${getCompanyInitial(company.name)}
                            </div>


                            <div class="company-info">

                                <h2>
                                    ${company.name}
                                </h2>

                                <p>
                                    <i class="bi bi-geo-alt me-1"></i>
                                    ${company.location}
                                </p>

                            </div>


                            <span class="application-count">
                                ${apps.length}
                                ${apps.length === 1
                                    ? "Application"
                                    : "Applications"}
                            </span>

                        </div>


                        <div class="distribution">

                            <div class="distribution-header">

                                <span>
                                    Application Distribution
                                </span>

                                <span>
                                    ${percentage}%
                                </span>

                            </div>


                            <div class="progress">

                                <div
                                    class="progress-bar"
                                    style="width: ${percentage}%"
                                ></div>

                            </div>


                            <div class="status-breakdown">

                                ${statusHTML}

                            </div>

                        </div>

                    </article>

                `;

            }).join("");
    }


    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {

        sessionStorage.removeItem(
            "jobSystemLoggedIn"
        );

        window.location.href =
            "login.html";
    }


    /* =========================================
       INITIAL RENDER
    ========================================= */

    renderCompanies();

</script>

</body>
</html>
